<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Shop Studio | Premium Photo Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #050505; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; position: relative; }

        /* --- Header with Dynamic Gradient & Stars --- */
        header {
            padding: 35px 20px; z-index: 100;
            text-align: center; border-bottom: 2px solid #1a1a1a;
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #101010 40%, #004080 70%, #0a0a0a 100%);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Shining Stars --- */
        .star {
            position: absolute; background-color: #fff; border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out; opacity: 0; z-index: 90;
        }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
        .star-1 { width: 2px; height: 2px; top: 20%; left: 15%; animation-delay: 0.2s; }
        .star-2 { width: 3px; height: 3px; top: 60%; left: 25%; animation-delay: 0.5s; }
        .star-3 { width: 2px; height: 2px; top: 30%; left: 75%; animation-delay: 1s; }
        .star-4 { width: 3px; height: 3px; top: 70%; left: 85%; animation-delay: 0.8s; }
        .star-5 { width: 2px; height: 2px; top: 10%; left: 50%; animation-delay: 1.2s; }
        .star-6 { width: 2px; height: 2px; top: 80%; left: 55%; animation-delay: 1.5s; }

        .studio-title { font-family: 'Oswald', sans-serif; font-size: 2.2rem; letter-spacing: 5px; text-transform: uppercase; color: #fff; position: relative; z-index: 100; }

        /* --- Background Animation Lines --- */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: radial-gradient(circle at center, #101010 0%, #050505 100%);
        }
        .line {
            position: absolute; bottom: -100px; width: 1px;
            background: linear-gradient(to top, transparent, #007bff, transparent);
            animation: moveUp 10s linear infinite; opacity: 0.2;
            box-shadow: 0 0 5px #007bff;
        }
        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-130vh); opacity: 0; }
        }

        /* --- Description Section (Moved Upward) --- */
        .description {
            padding: 20px; text-align: center; z-index: 50; 
            margin-top: 40px; /* Is se content uper move ho jaye ga */
            flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
        }
        .description h2 { color: #007bff; font-size: 1.3rem; margin-bottom: 10px; font-weight: 500; text-shadow: 0 2px 5px rgba(0,123,255,0.4); }
        .description p { font-size: 0.95rem; color: #b0b0b0; line-height: 1.8; max-width: 320px; margin: 0 auto; font-weight: 300; }

        /* --- Floating Buttons & Labels --- */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center; gap: 30px; z-index: 2000;
        }
        .fab { 
            width: 65px; height: 65px; border-radius: 50%; color: white; display: flex; 
            align-items: center; justify-content: center; font-size: 26px; cursor: pointer; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); transition: 0.4s ease; 
        }
        .file-fab { background: #007bff; }
        .chat-fab { background: #075e54; }

        .labels-center { display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .tag {
            color: white; padding: 5px 14px; border-radius: 20px; font-size: 10px;
            font-weight: bold; text-transform: uppercase; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            animation: tagBounce 2.5s infinite;
        }
        .tag-blue { background: #007bff; }
        .tag-green { background: #075e54; }

        @keyframes tagBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-7px); }
            60% { transform: translateY(-4px); }
        }

        /* --- Dark Windows --- */
        .win { 
            display: none; position: fixed; bottom: 105px; left: 50%; transform: translateX(-50%); 
            width: 350px; height: 480px; background: #0f0f0f; border-radius: 20px; 
            overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.7); z-index: 3000; 
            flex-direction: column; color: #fff; border: 1px solid #2a2a2a; 
        }
        @media (max-width: 400px) { .win { width: 94%; } }
        .win-header { padding: 18px; color: white; font-weight: bold; text-align: center; position: relative; }
        .close-btn { position: absolute; right: 18px; cursor: pointer; }
        #msg-box { flex: 1; overflow-y: auto; padding: 18px; background: #080808; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 10px 16px; border-radius: 12px; font-size: 13.5px; max-width: 80%; }
        .sent { align-self: flex-end; background: #007bff; color: #fff; }
        .received { align-self: flex-start; background: #202020; color: #fff; }
        .chat-input { padding: 12px; background: #0f0f0f; display: flex; gap: 10px; border-top: 1px solid #2a2a2a; }
        textarea { flex: 1; border-radius: 25px; border: 1px solid #3a3a3a; padding: 10px 18px; height: 44px; background: #050505; color: #fff; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; }
        .file-body { flex: 1; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .drop-zone { border: 2px dashed #007bff; padding: 35px 20px; border-radius: 15px; width: 100%; cursor: pointer; text-align: center; background: #080808; }
        .up-btn { background: #007bff; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-animation" id="bgLines"></div>

    <header>
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="star star-4"></div>
        <div class="star star-5"></div>
        <div class="star star-6"></div>
        <h1 class="studio-title">WORK SHOP</h1>
        <p style="color: #007bff; font-weight: bold; font-size: 0.9rem; letter-spacing: 2px;">CREATIVE PHOTO STUDIO</p>
    </header>

    <div class="description">
        <h2>Premium Editing & Sizing</h2>
        <p>Specialized photo editing and custom sizing exclusively for professional studios. High quality, fast delivery.</p>
    </div>

    <div class="bottom-nav">
        <div class="fab file-fab" onclick="openWin('file-win')">📎</div>
        <div class="labels-center">
            <div class="tag tag-blue">Send Files</div>
            <div class="tag tag-green">Live Chat</div>
        </div>
        <div class="fab chat-fab" onclick="openWin('chat-win')">💬</div>
    </div>

    <div class="win" id="file-win">
        <div class="win-header" style="background: #007bff;">Upload Multiple Photos <span class="close-btn" onclick="closeAll()">✕</span></div>
        <div class="file-body">
            <label class="drop-zone">
                <input type="file" id="file-input" multiple style="display:none;" onchange="updateFileCount()">
                <span id="file-name" style="color:#007bff; font-weight:bold;">Tap to Select Photos</span>
            </label>
            <button class="up-btn" onclick="sendToTelegram()">Send to Telegram</button>
            <p id="up-status" style="margin-top:15px; font-size:12px; font-weight:bold;"></p>
        </div>
    </div>

    <div class="win" id="chat-win">
        <div class="win-header" style="background: #075e54;">Support Chat <span class="close-btn" onclick="closeAll()">✕</span></div>
        <div id="msg-box"></div>
        <div class="chat-input">
            <textarea id="chat-text" placeholder="Type message..."></textarea>
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        const bg = document.getElementById('bgLines');
        for (let i = 0; i < 20; i++) {
            const line = document.createElement('div');
            line.className = 'line';
            line.style.left = Math.random() * 100 + 'vw';
            line.style.height = Math.random() * 100 + 50 + 'px';
            line.style.animationDelay = Math.random() * 8 + 's';
            bg.appendChild(line);
        }

        function openWin(id) {
            closeAll();
            document.getElementById(id).style.display = 'flex';
        }
        function closeAll() { document.querySelectorAll('.win').forEach(w => w.style.display = 'none'); }
        function updateFileCount() {
            const input = document.getElementById('file-input');
            document.getElementById('file-name').innerText = `${input.files.length} Photos Selected`;
        }

        async function sendToTelegram() {
            const input = document.getElementById('file-input');
            const status = document.getElementById('up-status');
            const TG_TOKEN = "8623511731:AAEQp1zW_9y4vgYZHcZENsfLCHmrmtNh6wY";
            const TG_ID = "8234464652";
            if(input.files.length === 0) return alert("Select photos!");
            status.innerText = "Uploading... ⏳";
            for (let i = 0; i < input.files.length; i++) {
                const fd = new FormData();
                fd.append('chat_id', TG_ID);
                fd.append('document', input.files[i]);
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendDocument`, { method: 'POST', body: fd });
            }
            status.innerText = "All Sent Successfully! ✅";
        }
    </script>
</body>
</html>
