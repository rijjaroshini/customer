<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Shop Photo Studio | Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #0a0a0a; color: #fff; overflow: hidden; }

        /* --- Main Webpage Design --- */
        .main-wrapper {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&q=80&w=1600');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .studio-title { font-family: 'Oswald', sans-serif; font-size: clamp(3rem, 10vw, 6rem); letter-spacing: 8px; text-transform: uppercase; color: #fff; }
        .studio-sub { font-size: 1.2rem; letter-spacing: 5px; color: #bbb; text-transform: uppercase; }

        /* --- Floating Chat Button --- */
        .chat-toggle-btn {
            position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px;
            background: #075e54; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 2000;
        }

        /* --- Chat Window --- */
        .chat-container { 
            display: none; flex-direction: column; height: 500px; width: 350px; 
            position: fixed; bottom: 100px; right: 25px; background: #fff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; z-index: 1999;
        }

        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; position: relative; }
        .close-chat { position: absolute; top: 12px; right: 15px; cursor: pointer; font-size: 20px; }

        #messages { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; 
            background: #e5ddd5 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
        }

        .bubble { padding: 8px 12px; border-radius: 10px; font-size: 14px; color: #333; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .received { align-self: flex-start; background: #fff; }

        .footer { background: #f0f0f0; padding: 10px; border-top: 1px solid #ddd; }
        .input-box { display: flex; gap: 8px; }
        textarea { flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 20px; outline: none; resize: none; height: 40px; font-family: inherit; }
        .btn-send { background: #075e54; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

        /* --- Login Overlay --- */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 2001; }
        .login-card { padding: 20px; text-align: center; color: white; width: 85%; }
        .login-card input { width: 100%; padding: 10px; margin-top: 15px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h1 class="studio-title">WORK SHOP</h1>
        <p class="studio-sub">Photo Studio & Creative Lab</p>
    </div>

    <div class="chat-toggle-btn" id="toggle-btn" onclick="toggleChat()">💬</div>

    <div class="chat-container" id="chat-window">
        <div class="header">
            Support Chat
            <span class="close-chat" onclick="toggleChat()">✕</span>
        </div>

        <div id="overlay">
            <div class="login-card">
                <h3>Welcome</h3>
                <input type="text" id="user-name" placeholder="Your Name...">
                <button class="btn-send" style="width:100%; border-radius:5px; margin-top:10px;" onclick="startChat()">Start Chat</button>
            </div>
        </div>

        <div id="messages"></div>
        <div class="footer">
            <div class="input-box">
                <textarea id="text-input" placeholder="Type a message..."></textarea>
                <button class="btn-send" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // 1. Firebase Config
        const fbConfig = {
            apiKey: "AIzaSyCSpUoYUJH17_IrWNpzQj@ME-6Ri_n5-jQ",
            databaseURL: "https://chat-1dd78-default-rtdb.firebaseio.com",
            projectId: "chat-1dd78",
        };
        if (!firebase.apps.length) firebase.initializeApp(fbConfig);
        const db = firebase.database();

        // 2. Telegram Config
        const TELEGRAM_TOKEN = "8623511731:AAEQp1zW_9y4vgYZHcZENsfLCHmrmtNh6wY"; 
        const TELEGRAM_CHAT_ID = "8234464652"; 

        let myName = localStorage.getItem('chat_name') || "";

        // Chat Toggle
        function toggleChat() {
            const chat = document.getElementById('chat-window');
            const btn = document.getElementById('toggle-btn');
            if (chat.style.display === 'none' || chat.style.display === '') {
                chat.style.display = 'flex';
                btn.style.display = 'none';
                if(myName) { document.getElementById('overlay').style.display = 'none'; loadMessages(); }
            } else {
                chat.style.display = 'none';
                btn.style.display = 'flex';
            }
        }

        // Start Chat
        function startChat() {
            const input = document.getElementById('user-name').value.trim();
            if(!input) return alert("Please enter your name");
            myName = input;
            localStorage.setItem('chat_name', myName);
            document.getElementById('overlay').style.display = 'none';
            loadMessages();
        }

        // Notify Telegram
        function notifyTelegram(msg) {
            const text = `🔔 *Studio Chat*\n👤 *From:* ${myName}\n💬 *Message:* ${msg}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;
            fetch(url).catch(err => console.error("Telegram Error:", err));
        }

        // Load Messages from Firebase
        function loadMessages() {
            db.ref('public_chat').on('value', snap => {
                const msgBox = document.getElementById('messages');
                msgBox.innerHTML = '';
                snap.forEach(child => {
                    const d = child.val();
                    if (d.name === myName || d.replyTo === myName) {
                        const isMe = d.name === myName;
                        msgBox.innerHTML += `<div class="bubble ${isMe ? 'sent' : 'received'}">${d.text}</div>`;
                    }
                });
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        }

        // Send Message
        function sendMsg() {
            const input = document.getElementById('text-input');
            const msgText = input.value.trim();
            if(!msgText) return;

            // Push to Firebase
            db.ref('public_chat').push({
                text: msgText,
                name: myName,
                time: Date.now()
            });

            // Call Telegram Notification
            notifyTelegram(msgText);

            input.value = '';
        }
    </script>
</body>
</html>
